x-function: &function
  image: postgres:18.6 # solo para usar psql
  environment:
    PGHOST: postgres
    PGPORT: 5432
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: postgres
  volumes:
    - ./scripts/BaseDatos.sql:/sql/BaseDatos.sql:ro
    - ./scripts/Reset.sql:/sql/Reset.sql:ro
  depends_on:
    postgres:
      condition: service_healthy
  entrypoint: [
    "psql", "-X",
    "-v", "ON_ERROR_STOP=1",
    "-v", "clientes=${CLIENTES_DB}",
    "-v", "cuentas=${CUENTAS_DB}"
  ]

services:
  db-init:
    <<: *function
    profiles: ["db-init"]
    command: ["-f", "/sql/BaseDatos.sql"]

  db-reset:
    <<: *function
    profiles: ["db-reset"]
    command: ["-f", "/sql/Reset.sql"]